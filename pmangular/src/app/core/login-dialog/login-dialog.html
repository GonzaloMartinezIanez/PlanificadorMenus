<h2 id="login-dialog-title" mat-dialog-title>Inicia sesión para planificar</h2>

<mat-dialog-content>
  <p>Accede con tu cuenta de Google para crear un grupo, organizar los menús y guardar tus favoritas.</p>
  <app-google-login
    (authenticated)="onAuthenticated()"
    (loadingChange)="onLoadingChange($event)"
    (loginError)="errorMessage.set($event)"
  />

  @if (isLoading()) {
    <p class="status-message" role="status">Conectando con el servidor...</p>
  }
  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }
</mat-dialog-content>
