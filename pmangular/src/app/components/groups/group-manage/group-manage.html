
<p>{{selectedGroup()?.group_name}}</p>
<p>{{selectedGroup()?.group_description}}</p>
<p>{{selectedGroup()?.group_code}}</p>
<p>{{selectedGroup()?.creation_date}}</p>

<table mat-table [dataSource]="groupMembers()" class="mat-shadow-2">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let element"> {{element.username}} </td>
  </ng-container>
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> Rol </th>
    <td mat-cell *matCellDef="let element"> {{element.role}} </td>
  </ng-container>
  <ng-container matColumnDef="accepted">
    <th mat-header-cell *matHeaderCellDef> Aceptado </th>
    <td mat-cell *matCellDef="let element"> {{element.accepted}} </td>
  </ng-container>

  <ng-container matColumnDef="joining_date">
    <th mat-header-cell *matHeaderCellDef> Fecha de solicitud </th>
    <td mat-cell *matCellDef="let element"> {{element.joining_date}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
