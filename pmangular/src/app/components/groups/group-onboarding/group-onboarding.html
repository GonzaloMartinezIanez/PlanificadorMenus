<header class="app-header">
  <h1>Planificador de menús</h1>
  @if (authService.isAuthenticated()) {
    <button
      mat-raised-button
      class="button-logout"
      type="button"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  }
</header>

<main class="page-content">
  <app-group-forms
    title="Todavía no tienes grupo"
    subtitle="Crea un grupo nuevo o únete a uno existente"
  />
</main>
