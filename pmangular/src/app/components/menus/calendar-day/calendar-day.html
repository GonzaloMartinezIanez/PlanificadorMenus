@if (day) {
  <article class="calendar-day" [class.calendar-day--past]="isPast" [class.calendar-day--today]="isToday">
    <h2>{{ formatDayText(day) }}</h2>

    <app-day-mealtime
      [title]="'Desayuno'"
      [time]="'BREAKFAST'"
      [menus]="getMenusByTime('BREAKFAST')"
      [readOnly]="isPast"
      (addRecipe)="onRecipeSelected($event)"
      (deleteRecipe)="onDeleteRecipe($event)"
    >
    </app-day-mealtime>

    <app-day-mealtime
      [title]="'Comida'"
      [time]="'LUNCH'"
      [menus]="getMenusByTime('LUNCH')"
      [readOnly]="isPast"
      (addRecipe)="onRecipeSelected($event)"
      (deleteRecipe)="onDeleteRecipe($event)"
    >
    </app-day-mealtime>

    <app-day-mealtime
      [title]="'Cena'"
      [time]="'DINNER'"
      [menus]="getMenusByTime('DINNER')"
      [readOnly]="isPast"
      (addRecipe)="onRecipeSelected($event)"
      (deleteRecipe)="onDeleteRecipe($event)"
    >
    </app-day-mealtime>
  </article>
}
