<section class="day-mealtime">
  <h3>{{ title }}</h3>

  @if (menus.length > 0) {
    <div class="day-mealtime-recipes">
      @for (menu of menus; track $index) {
        <div class="day-mealtime-recipe">
          <a [routerLink]="['/recipes', menu.recipe.id]">{{ menu.recipe.name }}</a>

          @if (!readOnly) {
            <button
              mat-icon-button
              class="button-danger"
              type="button"
              [attr.aria-label]="'Quitar ' + menu.recipe.name + ' del menú'"
              matTooltip="Quitar receta del menú"
              (click)="onDeleteRecipe(menu.recipe.id)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          }
        </div>
      }
    </div>
  }

  @if (!readOnly) {
    <button
      class="day-mealtime-add"
      mat-stroked-button
      type="button"
      [attr.aria-label]="'Añadir receta en ' + title"
      matTooltip="Añadir receta"
      (click)="openRecipeSearch()"
    >
      <span class="day-mealtime-add-symbol" aria-hidden="true">+</span>
    </button>
  }
</section>

<ng-template #recipeSearchDialog>
  <section class="day-mealtime-dialog">
    <div class="day-mealtime-search-dialog">
      <app-recipe-search
        [actionLabel]="'Añadir'"
        (actionClicked)="selectRecipe($event)"
        (detailsClicked)="closeRecipeSearch()"
      />
    </div>

    <button class="day-mealtime-dialog-close" mat-button type="button" (click)="dialog.closeAll()">Cerrar</button>
  </section>
</ng-template>
