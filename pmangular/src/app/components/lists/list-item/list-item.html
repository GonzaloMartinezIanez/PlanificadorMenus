<div style="display: flex; flex-direction: row">
  @if (item?.bought) {
    <mat-icon
      (click)="change(false)"
      aria-hidden="false"
      aria-label="Desmarcar un item"
      fontIcon="check"
      [style.color]="'green'"
    ></mat-icon>
  } @else {
    <mat-icon
      (click)="change(true)"
      aria-hidden="false"
      aria-label="Marcar un item"
      fontIcon="check"
    ></mat-icon>
  }

  <img src="{{ item?.ingredient?.image }}" alt="{{ item?.ingredient?.name }}" />
  <div style="display: flex; flex-direction: column">
    <p [ngStyle]="item?.bought ? { 'text-decoration': 'line-through' } : {}">
      <strong>{{ item?.ingredient?.name }}</strong> - {{ item?.amount }} {{ formatUnit() }}
    </p>
    <p>
      {{ item?.purchase_label }}
      @if (getItemPrice() !== null) {
        - Precio: {{ getItemPrice() }} €
      }
    </p>
  </div>

  @if (!editMode()) {
    <button mat-button type="button" (click)="startEdit()">Editar</button>
  } @else {
    <mat-form-field>
      <mat-label>Nueva cantidad</mat-label>
      <input
        matInput
        type="number"
        min="0.001"
        step="0.001"
        [ngModel]="editedAmount()"
        (ngModelChange)="editedAmount.set($event)"
      />
    </mat-form-field>

    <button mat-button type="button" (click)="editAmount()" [disabled]="editedAmount() < 0.001">
      Guardar
    </button>
    <button mat-button type="button" (click)="editMode.set(false)">Volver</button>
  }
</div>
